<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="AthleeSpeed">
<title>AthleeLive 球速入力</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;
  font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
:root{--red:#c8102e;--grn:#7dff5a}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;
  touch-action:manipulation;overscroll-behavior:none}

#pull-ind{
  position:fixed;left:50%;top:0;transform:translateX(-50%) translateY(-100%);
  z-index:900;background:#1a3a1a;border:2px solid #3a6a2a;border-top:none;
  border-radius:0 0 12px 12px;color:#86c867;font-size:16px;font-weight:800;
  padding:10px 22px;transition:transform .2s;pointer-events:none;
}
#pull-ind.show{transform:translateX(-50%) translateY(0)}
.app{display:flex;flex-direction:column;height:100%;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}

/* ヘッダー */
.hdr{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
  background:#fff;padding:5px 12px;min-height:40px}
.hdr-l{display:flex;align-items:center;gap:12px}
.qrbtn{background:none;border:none;color:#888;cursor:pointer;padding:4px;
  font-size:22px;line-height:0;flex-shrink:0}
.qrbtn:active{color:#111}
.hdr-t{font-size:17px;font-weight:800;color:#111;letter-spacing:.5px}
.wsdot{width:11px;height:11px;border-radius:50%;background:#c00;transition:background .3s}
.wsdot.on{background:#3ac13a}
.clock{font-size:18px;font-weight:800;color:#111;font-variant-numeric:tabular-nums}

/* 試合情報＋プレビュー */
.ctx{flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:8px;background:#131315;border-bottom:1px solid #242426;padding:7px 10px}
.ctx-side{min-width:0}
.ctx-side.left{text-align:left}
.ctx-side.right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ctx-t{font-size:13px;font-weight:800;color:#eee;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx-s{font-size:10px;color:#888;margin-top:2px;line-height:1.3}

/* 中央の球速プレビュー */
.preview{position:relative;display:flex;flex-direction:column;align-items:center;
  gap:1px;background:#040804;border:2px solid #1a3a1a;border-radius:12px;
  padding:7px 16px;min-width:0}
.pv-main{display:flex;align-items:baseline;gap:4px}
.pv-n{font-size:clamp(44px,13vw,64px);font-weight:900;color:var(--grn);line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:1px;
  text-shadow:0 0 12px rgba(125,255,90,.8),0 0 26px rgba(80,255,60,.4)}
.pv-u{font-size:18px;font-weight:800;color:rgba(125,255,90,.7)}
.pv-type{font-size:17px;font-weight:800;color:#b8a0e8;line-height:1.2;min-height:20px}
.pv-live{position:absolute;top:4px;right:6px;font-size:9px;font-weight:800;color:#7dff5a;
  border:1px solid rgba(125,255,90,.5);border-radius:20px;padding:2px 6px;
  opacity:0;transition:opacity .2s}
.pv-live.on{opacity:1}
.preview.empty{border-color:#151515}
.preview.empty .pv-n{color:#1e3a1e;text-shadow:none}
.preview.empty .pv-u{color:#1e3a1e}

/* BSO・走者 */
.cb-row{display:flex;align-items:center;gap:10px}
.cb-row2{display:flex;align-items:center;gap:8px}
.cb-info{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.cb-line{display:flex;align-items:center;gap:4px}
.cb-l{font-size:12px;font-weight:800;color:#777;width:11px}
.cb-d{display:flex;gap:4px}
.cb-dot{width:14px;height:14px;border-radius:50%;background:#2a2a2c;border:2px solid #3a3a3c;
  display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;
  color:rgba(0,0,0,.65);line-height:1}
.cb-dot.b{background:#3ac13a;border-color:#3ac13a}
.cb-dot.s{background:#e8c33d;border-color:#e8c33d}
.cb-dot.o{background:#c8102e;border-color:#c8102e}
.cb-dia{width:42px;height:42px;flex-shrink:0}
.cb-dia rect{fill:#2a2a2c;stroke:#4a4a4c;stroke-width:2}
.cb-dia rect.on{fill:#f5c518;stroke:#c8a02e}
.cb-dia rect.hp{fill:#3a3a3c}
.cb-bat{font-size:12px;color:#ccc;max-width:110px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb-ab{display:flex;gap:6px}
.cb-ab .f{font-size:11px;font-weight:800;color:#e8a33d;font-variant-numeric:tabular-nums}
.cb-ab .t{font-size:11px;font-weight:700;color:#888;font-variant-numeric:tabular-nums}


/* 履歴 */
.hist{flex-shrink:0;display:flex;align-items:center;gap:8px;
  background:#0d0d0f;border-bottom:1px solid #1e1e20;padding:6px 10px;min-height:44px}
.hist-t{font-size:11px;color:#555;letter-spacing:1px;flex-shrink:0}
.hist-list{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0}
.hist-b{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:0;
  border:2px solid #3a3a3c;background:#242426;color:#ccc;border-radius:8px;
  padding:6px 11px;cursor:pointer;line-height:1.1}
.hb-v{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.hb-t{font-size:10px;font-weight:700;color:#a890d8;white-space:nowrap}
.hist-b:active{transform:scale(.94)}
.hist-b.cur{border-color:#7dff5a;background:#1d3a1d;color:#adffa0}
.hist-empty{font-size:12px;color:#444}

/* 入力ブロック */
.body{flex:1;display:flex;flex-direction:column;gap:8px;padding:8px;min-height:0;overflow:hidden}
.blk{background:#141416;border:1px solid #262628;border-radius:14px;padding:10px;
  display:flex;flex-direction:column;min-height:0}
.blk:first-child{flex:1}
.blk.pitch{flex:0 0 auto}
.blk-t{display:flex;align-items:center;gap:10px;margin-bottom:7px;flex-shrink:0}
.blk-name{font-size:17px;font-weight:800;letter-spacing:2px}
.blk-name em{font-style:normal;font-size:14px;font-weight:700;
  color:#777;letter-spacing:0;margin-left:6px}
.blk.pitch .blk-name{color:#b8a0e8}
.pt{border:2px solid #3a3a3c;background:#242426;color:#ddd;border-radius:10px;
  font-size:clamp(12px,3.2vw,16px);font-weight:800;padding:18px 4px;cursor:pointer;
  transition:transform .06s,background .1s;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;text-align:center}
.pt:active{transform:scale(.94)}
.pt.on{background:#3a2a5a;border-color:#8a6ac8;color:#d8c0ff}

/* 十の位（左上から大きい順） */
.tens{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);
  gap:8px;place-items:center;min-height:0}
.t10{width:100%;height:100%;max-width:none;border-radius:50%;aspect-ratio:1/1;
  border:3px solid #3a3a3c;background:#242426;color:#eee;
  font-size:clamp(22px,6.5vw,34px);font-weight:900;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;justify-self:center;
  font-variant-numeric:tabular-nums;transition:transform .06s,background .1s}
.t10:active{transform:scale(.92);background:#3a3a3c}
.t10.kp{background:#1e2a3a;border-color:#3a5a8a;color:#8fc0ff;
  font-size:clamp(13px,3.4vw,16px);letter-spacing:0}

/* 1の位（押した位置に出る小窓） */
.ones-pop{
  display:none;position:fixed;z-index:820;
  background:#141416;border:2px solid #4a4a4c;border-radius:16px;
  box-shadow:0 10px 34px rgba(0,0,0,.8);padding:9px;
}
.ones-pop.open{display:block;animation:opIn .12s ease both}
@keyframes opIn{0%{opacity:0;transform:scale(.92)}100%{opacity:1;transform:scale(1)}}
.op-head{font-size:15px;font-weight:800;color:#888;text-align:center;margin-bottom:7px;
  font-variant-numeric:tabular-nums}
.ones{display:grid;grid-template-columns:repeat(3,auto);gap:8px;justify-content:center}
.one{width:clamp(58px,19vw,84px);height:clamp(58px,19vw,84px);
  border:3px solid #3a3a3c;background:#242426;color:#fff;
  border-radius:50%;font-size:clamp(26px,8vw,38px);font-weight:900;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;transition:transform .06s,background .1s}
.one:active{transform:scale(.94);background:#3a3a3c}
.one.sel{background:#1d5a1d;border-color:var(--grn)}
.one:disabled{opacity:.2;pointer-events:none}

/* 手入力パッド */
.kpb{border:2px solid #3a3a3c;background:#242426;color:#fff;border-radius:12px;
  font-size:32px;font-weight:900;padding:20px 0;cursor:pointer;
  font-variant-numeric:tabular-nums}
.kpb:active{background:#3a3a3c;transform:scale(.96)}

/* 下部 */
.foot{flex-shrink:0;display:flex;gap:7px;padding:0 8px 8px}
.fbtn{flex:1;border:2px solid #3a3a3c;background:#242426;color:#ccc;border-radius:12px;
  font-size:17px;font-weight:800;padding:16px 4px;cursor:pointer}
.fbtn:active{background:#3a3a3c}
.fbtn.clear{color:#ff8888;border-color:#5a2a2a}
.fbtn.undo{color:#e8c33d;border-color:#5a4a1a}

.toast{position:fixed;left:50%;bottom:13%;transform:translateX(-50%);
  background:rgba(30,30,32,.96);border:1px solid #555;border-radius:12px;color:#fff;
  font-size:18px;font-weight:700;padding:14px 26px;z-index:99;opacity:0;
  pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
<script src="/qrcode.js"></script>
</head>
<body>
<div id="pull-ind">同期中…</div>
<div class="app">

  <div class="hdr">
    <div class="hdr-l">
      <span class="wsdot" id="wsdot"></span>
      <span class="hdr-t">球速入力</span>
      <button class="qrbtn" onclick="openQR('ctrl/')" title="コントローラーを共有"><svg viewBox="0 0 24 24" fill="currentColor" style="width:1em;height:1em;display:block"><path d="M3 3h8v8H3V3zm2 2v4h4V5H5zm-2 8h8v8H3v-8zm2 2v4h4v-4H5zM13 3h8v8h-8V3zm2 2v4h4V5h-4zM13 13h3v3h-3v-3zm5 0h3v3h-3v-3zm-5 5h3v3h-3v-3zm5 0h3v3h-3v-3z"/></svg></button>
    </div>
    <span class="clock" id="clock">--:--</span>
  </div>

  <div class="ctx" id="ctx">
    <div class="ctx-side left">
      <div class="ctx-t" id="ctx-title">—</div>
      <div class="ctx-s" id="ctx-sub">接続待ち</div>
    </div>

    <div class="preview empty" id="last">
      <div class="pv-main">
        <span class="pv-n" id="last-n">---</span><span class="pv-u">km/h</span>
      </div>
      <div class="pv-type" id="pv-type"></div>
      <span class="pv-live" id="last-live">表示中</span>
    </div>

    <div class="ctx-side right">
      <div class="cb-row">
        <div class="cb-line"><span class="cb-l">B</span><span class="cb-d" id="cb-b"></span></div>
        <div class="cb-line"><span class="cb-l">S</span><span class="cb-d" id="cb-s"></span></div>
        <div class="cb-line"><span class="cb-l">O</span><span class="cb-d" id="cb-o"></span></div>
      </div>
      <div class="cb-row2">
        <svg class="cb-dia" viewBox="0 0 60 60">
          <rect id="cb-b2" x="22" y="3"  width="16" height="16" transform="rotate(45 30 11)"/>
          <rect id="cb-b3" x="6"  y="19" width="16" height="16" transform="rotate(45 14 27)"/>
          <rect id="cb-b1" x="38" y="19" width="16" height="16" transform="rotate(45 46 27)"/>
          <rect id="cb-hp" x="22" y="35" width="16" height="16" transform="rotate(45 30 43)" class="hp"/>
        </svg>
        <div class="cb-info">
          <div class="cb-bat" id="cb-bat"></div>
          <div class="cb-ab" id="cb-ab"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="hist" id="hist">
    <span class="hist-t">履歴</span>
    <div class="hist-list" id="hist-list"></div>
  </div>

  <div class="body">
    <!-- 十の位 -->
    <div class="blk">
      <div class="blk-t"><span class="blk-name">球速 <em>km/h</em></span></div>
      <div class="tens" id="tens"></div>
    </div>

    <!-- 球種 -->
    <div class="blk pitch">
      <div class="blk-t"><span class="blk-name">球種</span></div>
      <div class="ptypes" id="ptypes"></div>
    </div>
  </div>

  <!-- 1の位（押した十の位の位置に出る小窓） -->
  <div id="ones-pop" class="ones-pop">
    <div class="op-head"><span id="op-base">130</span></div>
    <div class="ones" id="ones"></div>
  </div>

  <div class="foot">
    <button class="fbtn" onclick="resend()">↻ 再表示</button>
    <button class="fbtn undo" onclick="undoSpeed()">↩ 取り消し</button>
    <button class="fbtn clear" onclick="clearSpeed()">✕ 消す</button>
  </div>
</div>


<!-- QRコード表示 -->
<div id="qr-mask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:900;align-items:center;justify-content:center;padding:16px"
  onclick="if(event.target===this)closeQR()">
  <div style="background:#1c1c1e;border:2px solid #444;border-radius:18px;padding:24px;width:100%;max-width:400px;text-align:center">
    <div id="qr-name" style="font-size:26px;font-weight:800;color:#fff;margin-bottom:4px"></div>
    <div id="qr-desc" style="font-size:15px;color:#888;margin-bottom:18px"></div>
    <div id="qr-img" style="background:#fff;padding:12px;border-radius:12px;display:inline-block;line-height:0"></div>
    <div id="qr-url" style="font-size:12px;color:#666;word-break:break-all;line-height:1.5;margin-top:14px"></div>
    <button onclick="closeQR()"
      style="width:100%;margin-top:18px;background:#2c2c2e;border:2px solid #444;border-radius:12px;color:#ccc;font-size:19px;font-weight:700;padding:16px;cursor:pointer">閉じる</button>
  </div>
</div>

<!-- 3桁手入力 -->
<div id="kp-mask" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:800;align-items:center;justify-content:center;padding:16px"
  onclick="if(event.target===this)closeKeypad()">
  <div style="width:100%;max-width:420px">
    <div style="text-align:center;margin-bottom:12px">
      <div style="font-size:16px;color:#888;margin-bottom:6px">球速を入力</div>
      <div id="kp-val" style="font-size:60px;font-weight:900;color:#7dff5a;line-height:1;
        font-variant-numeric:tabular-nums;text-shadow:0 0 14px rgba(125,255,90,.6);min-height:60px">—</div>
    </div>
    <div id="kp-pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px"></div>
    <div style="display:flex;gap:9px;margin-top:9px">
      <button onclick="kpBack()" style="flex:1;background:#2c2c2e;border:2px solid #444;border-radius:12px;
        color:#ccc;font-size:20px;font-weight:800;padding:20px 6px;cursor:pointer">← 1文字消す</button>
      <button onclick="kpOk()" style="flex:1;background:#1d5a1d;border:2px solid #7dff5a;border-radius:12px;
        color:#fff;font-size:20px;font-weight:800;padding:20px 6px;cursor:pointer">決定</button>
    </div>
    <button onclick="closeKeypad()" style="width:100%;margin-top:9px;background:#242426;border:2px solid #3a3a3c;
      border-radius:12px;color:#999;font-size:18px;font-weight:700;padding:16px;cursor:pointer">キャンセル</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var MINV = 10, MAXV = 200;
var lastVal = null;
var baseTens = null;   // 選択中の十の位（例：130）

function g(id){ return document.getElementById(id); }

function toast(m){
  var t=g('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); },1300);
}
function buzz(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms||14); }catch(e){} }

// ── 十の位 ────────────────────────────────────────────────────────────────
var TENS = [150,140,130,120,110,100,90,80,70,60,50];

function renderTens(){
  var box=g('tens');
  if(!box) return;
  var h = TENS.map(function(v){
    return '<button class="t10" data-v="'+v+'" onclick="pickTens('+v+',this)">'+v+'</button>';
  }).join('');
  h += '<button class="t10 kp" onclick="openKeypad()">手入力</button>';
  box.innerHTML=h;
}

// 十の位を押す → その位置に1の位の小窓を出す
function pickTens(v, el){
  baseTens = v;
  buzz(12);
  g('op-base').textContent = v;
  renderOnes();

  var pop=g('ones-pop');
  pop.classList.add('open');

  // 押したボタンの中心に重ねる（画面外にはみ出さないよう補正）
  if(el){
    var r=el.getBoundingClientRect();
    var w=pop.offsetWidth, h=pop.offsetHeight;
    var left = r.left + r.width/2 - w/2;
    var top  = r.top  + r.height/2 - h/2;
    left = Math.max(6, Math.min(window.innerWidth  - w - 6, left));
    top  = Math.max(6, Math.min(window.innerHeight - h - 6, top));
    pop.style.left = left+'px';
    pop.style.top  = top+'px';
  }
}

function backToTens(){
  baseTens=null;
  var pop=g('ones-pop');
  if(pop) pop.classList.remove('open');
}

// ── 1の位（テンキー配列） ─────────────────────────────────────────────────
var ONES_LAYOUT = [7,8,9,4,5,6,1,2,3,0];

function renderOnes(){
  var box=g('ones');
  if(!box) return;
  box.innerHTML = ONES_LAYOUT.map(function(d,i){
    var v = baseTens + d;
    var dis = (v<MINV||v>MAXV) ? ' disabled' : '';
    var wide = (d===0) ? ' style="grid-column:2"' : '';
    return '<button class="one'+(shownVal===v?' sel':'')+'"'+wide+dis
      +' onclick="sendSpeed('+v+',this)">'+d+'</button>';
  }).join('');
}

// ── 3桁の手入力 ───────────────────────────────────────────────────────────
var kpBuf = '';

function openKeypad(){
  kpBuf='';
  _kpRender();
  var pad=g('kp-pad');
  pad.innerHTML = [7,8,9,4,5,6,1,2,3].map(function(d){
    return '<button class="kpb" onclick="kpPush('+d+')">'+d+'</button>';
  }).join('') + '<button class="kpb" style="grid-column:1 / -1" onclick="kpPush(0)">0</button>';
  g('kp-mask').style.display='flex';
}

function closeKeypad(){ g('kp-mask').style.display='none'; }

function kpPush(d){
  if(kpBuf.length>=3) return;
  kpBuf += String(d);
  buzz(10);
  _kpRender();
}
function kpBack(){ kpBuf=kpBuf.slice(0,-1); _kpRender(); }
function _kpRender(){ g('kp-val').textContent = kpBuf || '—'; }

function kpOk(){
  var v=Number(kpBuf);
  if(!kpBuf || v<MINV || v>MAXV){
    toast(MINV+'〜'+MAXV+' の範囲で入力してください');
    return;
  }
  closeKeypad();
  sendSpeed(v, null);
}


// ── 球種 ──────────────────────────────────────────────────────────────────
var PITCH_TYPES = ['ストレート','カーブ','スライダー',
                   'チェンジアップ','フォーク','シュート'];
var curType = null;

function renderTypes(){
  var box=g('ptypes');
  if(!box) return;
  box.innerHTML = PITCH_TYPES.map(function(t){
    return '<button class="pt'+(curType===t?' on':'')+'" onclick="pickType(\''+t+'\')">'+t+'</button>';
  }).join('');
}

// 球種を選ぶ（もう一度押すと解除）
function pickType(t){
  curType = (curType===t) ? null : t;
  buzz(12);
  renderTypes();
  _renderLast();
  // すでに球速を出しているときは、その表示に球種を足す
  if(shownVal!=null){
    push({ v:shownVal, type:curType, ts:Date.now() });
    _armAutoClear();
  }
}

// ── 送信 ──────────────────────────────────────────────────────────────────
var hist = [];        // 入力履歴 [{v, type}]（新しいものが末尾）
var shownVal = null;  // 今オーバーレイに出している値
var HIST_MAX = 12;

function _renderLast(){
  var L=g('last');
  var t=g('pv-type');
  if(shownVal==null){
    g('last-n').textContent='---';
    if(t) t.textContent='';
    L.classList.add('empty');
    g('last-live').classList.remove('on');
  }else{
    g('last-n').textContent=shownVal;
    if(t) t.textContent = curType || '';
    L.classList.remove('empty');
    g('last-live').classList.add('on');
  }
}

function _renderHist(){
  var box=g('hist-list');
  if(!box) return;
  if(!hist.length){
    box.innerHTML='<span class="hist-empty">まだ入力がありません</span>';
    return;
  }
  // 新しいものを左に
  var list=hist.slice().reverse();
  box.innerHTML=list.map(function(h,i){
    var cur = (i===0 && shownVal===h.v) ? ' cur' : '';
    var tp = h.type ? '<span class="hb-t">'+h.type+'</span>' : '';
    return '<button class="hist-b'+cur+'" onclick="reshow('+h.v+',\''+(h.type||'')+'\')">'
      +'<span class="hb-v">'+h.v+'</span>'+tp+'</button>';
  }).join('');
}

var _autoClearTimer=null;

// 8秒後（表示が消えるとき）に選択をすべてリセットする
function _armAutoClear(){
  if(_autoClearTimer) clearTimeout(_autoClearTimer);
  _autoClearTimer=setTimeout(function(){
    _autoClearTimer=null;
    shownVal=null;
    curType=null;
    _renderLast(); _renderHist(); renderTypes();
    renderOnes();
  }, 8000);
}

// 球速を入力して表示する
function sendSpeed(v, el){
  hist.push({ v:v, type:curType });
  if(hist.length>HIST_MAX) hist.shift();
  shownVal=v;
  lastVal=v;
  buzz(18);
  if(el){
    el.classList.add('hit');
    setTimeout(function(){ el.classList.remove('hit'); },220);
  }
  _renderLast(); _renderHist();
  push({ v:v, type:curType, ts:Date.now() });
  _armAutoClear();
  backToTens();      // 次の入力に備えて十の位に戻す
}

// 履歴から選んでもう一度表示する
function reshow(v, type){
  shownVal=v; lastVal=v;
  curType = type || null;
  renderTypes();
  buzz(14);
  _renderLast(); _renderHist();
  push({ v:v, type:curType, ts:Date.now() });
  _armAutoClear();
  toast(v+' km/h を表示');
}

// 同じ値をもう8秒表示する
function resend(){
  if(shownVal==null){
    if(!hist.length){ toast('まだ入力がありません'); return; }
    var last=hist[hist.length-1];
    shownVal=last.v; curType=last.type||null;
    renderTypes();
  }
  buzz(14);
  _renderLast(); _renderHist();
  push({ v:shownVal, type:curType, ts:Date.now() });
  _armAutoClear();
  toast(shownVal+' km/h を再表示');
}

// 直前の入力を取り消す（履歴からも消す）
function undoSpeed(){
  if(_autoClearTimer){ clearTimeout(_autoClearTimer); _autoClearTimer=null; }
  if(!hist.length){ toast('取り消す入力がありません'); return; }
  var removed=hist.pop();
  buzz(20);
  if(hist.length){
    var prev=hist[hist.length-1];
    shownVal=prev.v; curType=prev.type||null;
    renderTypes();
    push({ v:shownVal, type:curType, ts:Date.now() });
    toast(removed.v+' を取り消し → '+shownVal+' を表示');
  }else{
    shownVal=null;
    push({ v:null, ts:Date.now(), clear:true });
    toast(removed.v+' を取り消しました');
  }
  _renderLast(); _renderHist();
}

// 表示だけ消す（履歴は残す）
function clearSpeed(){
  if(_autoClearTimer){ clearTimeout(_autoClearTimer); _autoClearTimer=null; }
  curType=null; renderTypes();
  shownVal=null;
  _renderLast(); _renderHist();
  push({ v:null, ts:Date.now(), clear:true });
  toast('表示を消しました');
}

// ── 通信 ──────────────────────────────────────────────────────────────────
var ws=null, wsTimer=null, state=null;

function setDot(on){ g('wsdot').className='wsdot'+(on?' on':''); }

function connect(){
  if(wsTimer){ clearTimeout(wsTimer); wsTimer=null; }
  try{
    ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
    ws.onopen=function(){
      setDot(true);
      try{ ws.send(JSON.stringify({ _req:'state' })); }catch(e){}
    };
    ws.onclose=function(){ ws=null; setDot(false); wsTimer=setTimeout(connect,3000); };
    ws.onerror=function(){ try{ ws.close(); }catch(e){} };
    ws.onmessage=function(ev){
      var s=null;
      try{ s=JSON.parse(ev.data); }catch(e){ return; }
      if(s && s._pcEdit) return;
      if(!s || s._ctl!==true) return;
      state=s;   // 他の状態は保持したまま送り返す
      renderCtx(s);
    };
  }catch(e){ wsTimer=setTimeout(connect,3000); }
}

function push(speed){
  if(!ws || ws.readyState!==1){ toast('未接続です'); return; }
  // 球速に、そのときの投手・打者・回を添えて送る
  var s = state || {};
  if(speed && speed.v!=null && !speed.clear){
    speed.pitcherId = (s.selIds && s.selIds.pitcher) || 0;
    speed.pitcher   = (s.pitcher||'').replace(/^#\d+\s*/,'');
    speed.batter    = (s.batter||'').replace(/^#\d+\s*/,'');
    speed.inn       = s.inn || 0;
    speed.top       = s.top !== false;
  }
  ws.send(JSON.stringify({ _spd:true, speed:speed }));
}


// ── QRコード表示（1画面ぶん） ─────────────────────────────────────────────
var QR_INFO = {
  'ctrl/':    { name:'コントローラー', desc:'スコア・BSO・走者の操作' },
  'spd/':     { name:'球速入力',      desc:'球速の入力専用' },
  'roster/':  { name:'メンバー管理',  desc:'選手登録・打順・守備' },
  'overlay.html': { name:'オーバーレイ', desc:'配信に重ねる画面' }
};

function openQR(file){
  var info = QR_INFO[file] || { name:file, desc:'' };
  var url  = location.origin + '/' + file;

  var m = document.getElementById('qr-mask');
  if(!m) return;
  document.getElementById('qr-name').textContent = info.name;
  document.getElementById('qr-desc').textContent = info.desc;
  document.getElementById('qr-url').textContent  = url;

  var qbox = document.getElementById('qr-img');
  qbox.innerHTML = '';
  try{
    var q = qrcode(0,'M');
    q.addData(url);
    q.make();
    qbox.innerHTML = q.createSvgTag({ cellSize:4, margin:0 });
    var svg = qbox.querySelector('svg');
    if(svg){ svg.style.display='block'; svg.style.width='200px'; svg.style.height='200px'; }
  }catch(e){
    qbox.innerHTML = '<div style="width:200px;height:200px;display:flex;align-items:center;'
      + 'justify-content:center;color:#c00;font-size:13px">生成に失敗しました</div>';
  }
  m.style.display = 'flex';
}

function closeQR(){
  var m = document.getElementById('qr-mask');
  if(m) m.style.display = 'none';
}

// ── 画面を引っ張って同期を要求する ────────────────────────────────────────
(function(){
  var startY=0, pulling=false, fired=false;
  var TH=90;

  function ind(show){
    var el=document.getElementById('pull-ind');
    if(el) el.classList.toggle('show', !!show);
  }

  function req(){
    if(!ws || ws.readyState!==1){ return; }
    try{ ws.send(JSON.stringify({ _req:'state' })); }catch(e){}
  }

  document.addEventListener('touchstart', function(e){
    if(window.scrollY>0){ pulling=false; return; }
    if(!e.touches || !e.touches.length) return;
    startY=e.touches[0].clientY;
    pulling=true; fired=false;
  }, {passive:true});

  document.addEventListener('touchmove', function(e){
    if(!pulling || fired) return;
    if(window.scrollY>0){ pulling=false; ind(false); return; }
    var dy=e.touches[0].clientY - startY;
    if(dy>TH){
      fired=true;
      ind(true);
      req();
      setTimeout(function(){ ind(false); }, 1200);
    }
  }, {passive:true});

  document.addEventListener('touchend', function(){
    pulling=false;
    if(!fired) ind(false);
  });
})();

// ── 試合情報を表示 ────────────────────────────────────────────────────────
function renderCtx(s){
  var t=g('ctx-title'), sub=g('ctx-sub');
  if(!t||!sub) return;
  t.textContent = (s.gameTitle && s.gameTitle.trim()) ? s.gameTitle : '—';

  var isTop = s.top!==false;
  var an=s.aab||'先攻', hn=s.hnm||'後攻';
  var asum=function(a){ return (a||[]).filter(function(v){ return typeof v==='number'; })
    .reduce(function(x,y){ return x+y; },0); };
  var at=asum(s.asc), ht=asum(s.hsc);
  var pit=(s.pitcher||'').replace(/^#\d+\s*/,'');
  var cat=(s.catcher||'').replace(/^#\d+\s*/,'');

  sub.textContent = (s.inn||1)+'回'+(isTop?'表':'ウラ')
    + ' ／ ' + an + ' ' + at + ' - ' + ht + ' ' + hn
    + (pit ? ' ／ 投 '+pit : '')
    + (cat ? ' ・ 捕 '+cat : '');

  // BSO
  var dots=function(id,n,max,cls){
    var el=g(id); if(!el) return;
    var h='';
    for(var i=0;i<max;i++) h+='<span class="cb-dot'+(i<n?' '+cls:'')+'"></span>';
    el.innerHTML=h;
  };
  (function(){
    var el=g('cb-b'); if(!el) return;
    var seq=Array.isArray(s.abBallSeq)?s.abBallSeq:[];
    var h='';
    for(var i=0;i<3;i++){
      var on=i<(s.b||0);
      h+='<span class="cb-dot'+(on?' b':'')+'">'+((on&&seq[i])?seq[i]:'')+'</span>';
    }
    el.innerHTML=h;
  })();
  dots('cb-o', s.o||0, 2, 'o');
  // ストライクはファウル分に F を出す
  (function(){
    var el=g('cb-s'); if(!el) return;
    var sl=Array.isArray(s.strikeSlots)?s.strikeSlots:[];
    var h='';
    for(var i=0;i<2;i++){
      var on=i<(s.s||0), x=sl[i];
      h+='<span class="cb-dot'+(on?' s':'')+'">'+((on&&x)?(x.foul?'F':x.n):'')+'</span>';
    }
    el.innerHTML=h;
  })();

  // 走者
  var r=s.r||{};
  [['cb-b1',1],['cb-b2',2],['cb-b3',3]].forEach(function(pair){
    var el=g(pair[0]);
    if(el) el.setAttribute('class', r[pair[1]] ? 'on' : '');
  });

  // 打者
  var bat=g('cb-bat');
  if(bat) bat.textContent = s.batter ? ('打 '+String(s.batter).replace(/^#\d+\s*/,'')) : '';

  // 打席の球数・ファウル
  var ab=g('cb-ab');
  if(ab){
    var np=s.abPitch||0, nf=s.abFoul||0;
    ab.innerHTML = (nf>0 ? '<span class="f">F'+nf+'</span>' : '')
      + (np>0 ? '<span class="t">'+np+'球</span>' : '');
  }
}

// ── 時計 ──────────────────────────────────────────────────────────────────
function tick(){
  var d=new Date(), p=function(n){ return String(n).padStart(2,'0'); };
  g('clock').textContent=p(d.getHours())+':'+p(d.getMinutes());
}

// ── 起動 ──────────────────────────────────────────────────────────────────
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

// 小窓の外を触ったら閉じる
document.addEventListener('pointerdown', function(e){
  var pop=g('ones-pop');
  if(!pop || !pop.classList.contains('open')) return;
  if(pop.contains(e.target)) return;
  if(e.target.closest && e.target.closest('.t10')) return;
  backToTens();
});

var wakeLock=null;
function reqWake(){
  if(!('wakeLock' in navigator)) return;
  navigator.wakeLock.request('screen').then(function(l){
    wakeLock=l;
    l.addEventListener('release', function(){ setTimeout(reqWake,1000); });
  }).catch(function(){});
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible') reqWake();
});
reqWake();

renderTens();
renderTypes();
_renderLast(); _renderHist();
tick(); setInterval(tick,1000);
setDot(false);
connect();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js', {scope:'./'}).catch(function(){});
}
