<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AthleeLive メンバー管理（PC）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;-webkit-touch-callout:none}
:root{--red:#c8102e;--bg:#111;--panel:#1c1c1e;--line:#2a2a2c;--txt:#fff;--sub:#888}
html,body{background:var(--bg);color:var(--txt);min-height:100%}
body{padding-bottom:40px}

/* ヘッダー */
.hdr{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;
  background:#fff;border-bottom:1px solid rgba(0,0,0,.1);padding:8px 18px;min-height:56px}
.hdr-left{display:flex;align-items:center;gap:10px}
.hdr-logo{height:26px;width:auto;display:block}
.hdr-sub{font-size:15px;font-weight:700;color:#444;letter-spacing:.5px}
.hdr-right{display:flex;align-items:center;gap:12px}
.hdr-div{width:1px;height:22px;background:rgba(0,0,0,.15)}
.clock{font-size:20px;font-weight:700;color:#222;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.batt{display:flex;align-items:center;gap:6px}
.batt-shell{position:relative;width:30px;height:15px;border:2px solid #444;border-radius:4px;padding:1.5px}
.batt-shell::after{content:'';position:absolute;right:-5px;top:4px;width:3px;height:7px;
  background:#444;border-radius:0 2px 2px 0}
.batt-fill{display:block;height:100%;width:0%;background:#3ac13a;border-radius:1px;transition:width .4s,background .4s}
.batt-fill.mid{background:#e8a33d}
.batt-fill.low{background:#d33}
.batt-txt{font-size:13px;font-weight:700;color:#333;font-variant-numeric:tabular-nums;min-width:34px}
.batt.charging .batt-txt::after{content:' ⚡'}
.ws-dot{width:10px;height:10px;border-radius:50%;background:#c00;transition:background .3s}
.ws-dot.on{background:#3ac13a}
.ws-label{font-size:13px;color:#555}

/* ロックボタン */
.btn-lock{background:#e8f3e8;border-color:#8fc98f;color:#2a6a2a}
.btn-lock.locked{background:#fde8e8;border-color:#e0a0a0;color:#a02a2a}

/* 試合状況バー */
.gamebar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px}
.gb-inn{display:flex;align-items:baseline;gap:4px}
.gb-inn-num{font-size:30px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.gb-inn-tb{font-size:16px;font-weight:700;color:var(--red)}

.gb-score{border-collapse:collapse;font-variant-numeric:tabular-nums}
.gb-score th{font-size:10px;color:#666;font-weight:600;padding:1px 6px;border-bottom:1px solid #333}
.gb-score td{font-size:14px;font-weight:700;color:#bbb;padding:2px 6px;text-align:center;min-width:22px}
.gb-score td.tname{color:#fff;text-align:left;font-size:12px;max-width:110px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;padding-right:10px;border-right:1px solid #333}
.gb-score td.cur{color:#fff}
.gb-score td.tot{color:#fff;font-size:17px;border-left:1px solid #333;padding-left:9px}
.gb-score th.tot{border-left:1px solid #333}

.gb-bso{display:flex;flex-direction:column;gap:3px}
.gb-bso-line{display:flex;align-items:center;gap:6px}
.gb-bso-lbl{font-size:11px;font-weight:800;color:#777;width:11px}
.gb-dots{display:flex;gap:4px}
.gb-dot{width:11px;height:11px;border-radius:50%;background:#333}
.gb-dot.on-b{background:#3ac13a}
.gb-dot.on-s{background:#e8c33d}
.gb-dot.on-o{background:var(--red)}

.gb-dia{width:56px;height:56px;flex-shrink:0}
.gb-dia rect{fill:#2a2a2c;stroke:#444;stroke-width:1.5}
.gb-dia rect.on{fill:#e8c33d;stroke:#e8c33d}
.gb-dia #gb-hp{fill:#3a3a3c}

.gb-people{display:flex;gap:22px}
.gb-col{display:flex;flex-direction:column;gap:3px;font-size:13px;min-width:150px}
.gb-bt-line{display:flex;align-items:center;gap:7px;color:#eee;white-space:nowrap}
.gb-bt-line.sub{font-size:11px;color:#8a8a8a}
.gb-bt-tag{font-size:10px;font-weight:800;color:#666;background:#2a2a2c;
  border-radius:3px;padding:2px 5px;flex-shrink:0;min-width:26px;text-align:center}
.gb-bt-tag.bat{background:rgba(200,16,46,.22);color:#ff8090}
.gb-bt-tag.def{background:rgba(26,86,160,.25);color:#8ab4ff}

.gb-flags{display:flex;flex-wrap:wrap;gap:5px;align-content:center;max-width:190px}
.gb-ann{display:flex;flex-direction:column;gap:5px;margin-left:auto}
.ann-btn{background:#2c2c2e;border:1px solid #3a3a3c;border-radius:8px;color:#999;
  font-size:13px;font-weight:700;padding:8px 12px;cursor:pointer;white-space:nowrap;transition:.15s}
.ann-btn:hover{background:#3a3a3c}
.ann-btn.on{background:#1a3a1a;border-color:#3a6a2a;color:#86c867}
.ann-btn.call{background:#22301a;border-color:#4a6a2a;color:#b8e878}
.ann-btn.call:hover{background:#2e4022}
.gb-flag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:11px;
  background:#242426;color:#5a5a5c;border:1px solid #303032}
.gb-flag.on{background:rgba(58,193,58,.16);color:#7fd47f;border-color:rgba(58,193,58,.45)}

/* ロック時 */
body.locked .team input,body.locked .team select,body.locked .team button,
body.locked .team label{pointer-events:none;opacity:.5}
body.locked .row{cursor:default}

/* レイアウト */
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;max-width:1600px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}

.team{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.team-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.team-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;flex-shrink:0}
.badge-away{background:rgba(200,16,46,.18);color:#ff8090;border:1px solid rgba(200,16,46,.4)}
.badge-home{background:rgba(26,86,160,.22);color:#8ab4ff;border:1px solid rgba(26,86,160,.5)}
.team-name-inp{flex:1;background:#2c2c2e;border:1px solid #3a3a3c;border-radius:8px;color:#fff;
  font-size:18px;font-weight:700;padding:9px 12px;outline:none}
.team-name-inp:focus{border-color:#555}

/* ツールバー */
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.btn{background:#2c2c2e;border:1px solid #3a3a3c;border-radius:8px;color:#ddd;font-size:13px;
  font-weight:600;padding:9px 12px;cursor:pointer;white-space:nowrap;transition:.15s}
.btn:hover{background:#3a3a3c}
.btn-scan{background:#1a2a3a;border-color:#3a5a8a;color:#8fc0ff}
.btn-save{background:#1a3a1a;border-color:#3a6a2a;color:#86c867}
.btn-load{background:#1a1a3a;border-color:#3a3a8a;color:#9a9aff}
.btn-red{background:#3a1a1a;border-color:#8a3a3a;color:#ff8888}

/* テーブル */
.tbl-head,.row{display:grid;grid-template-columns:34px 52px 62px 1fr 92px 84px;gap:6px;align-items:center}
.tbl-head{padding:8px 14px;font-size:11px;color:var(--sub);letter-spacing:.5px;border-bottom:1px solid var(--line)}
.list{padding:6px 10px;min-height:60px}
.row{padding:6px 4px;border-bottom:1px solid #232325;border-radius:6px;transition:background .12s}
.row:hover{background:#232325}
.row.dragging{opacity:.4}
.row.over{box-shadow:inset 0 2px 0 var(--red)}
.row.bench{opacity:.62}
.grip{cursor:grab;color:#555;font-size:16px;text-align:center;user-select:none}
.grip:active{cursor:grabbing}
.cell-inp{width:100%;background:#252527;border:1px solid #333;border-radius:6px;color:#fff;
  font-size:14px;padding:7px 6px;outline:none;text-align:center}
.cell-inp.name{text-align:left;font-size:15px;padding-left:10px}
.cell-inp:focus{border-color:#666;background:#2c2c2e}
.cell-sel{width:100%;background:#252527;border:1px solid #333;border-radius:6px;color:#fff;
  font-size:14px;padding:7px 4px;outline:none;-webkit-appearance:none;appearance:none;text-align:center}
.row-acts{display:flex;gap:4px;justify-content:flex-end}
.mini{background:#2c2c2e;border:1px solid #3a3a3c;border-radius:6px;color:#aaa;font-size:11px;
  padding:6px 7px;cursor:pointer;white-space:nowrap}
.mini:hover{background:#3a3a3c;color:#fff}
.mini.del{color:#ff7777;border-color:#5a2a2a}

/* 追加行 */
.addrow{display:grid;grid-template-columns:34px 52px 62px 1fr 92px 84px;gap:6px;align-items:center;
  padding:10px 14px;border-top:1px solid var(--line);background:#191919}
.sec-lbl{padding:10px 14px 4px;font-size:11px;color:var(--sub);letter-spacing:1px;border-top:1px solid var(--line)}

/* 交代パネル */
.subbar{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}

/* モーダル */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;
  align-items:center;justify-content:center;padding:24px}
.mask.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;
  max-width:720px;max-height:86vh;overflow-y:auto;padding:20px}
.modal h3{font-size:18px;margin-bottom:6px}
.modal .note{font-size:13px;color:var(--sub);margin-bottom:14px}
.scan-row{display:grid;grid-template-columns:56px 62px 1fr 96px 40px;gap:8px;align-items:center;
  padding:7px 0;border-bottom:1px solid #262628}
.modal-acts{display:flex;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2c2c2e;
  border:1px solid #444;border-radius:10px;color:#fff;font-size:14px;padding:12px 20px;
  z-index:300;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
</style>
</head>

  <table class="gb-score">

      <tr id="gb-sc-away"></tr>
      <tr id="gb-sc-home"></tr>
    </tbody>
  </table>

  <div class="gb-bso">

  <div class="team">

    <div class="tbl-head">
      <span></span><span>打順</span><span>背番号</span><span>選手名</span><span>守備</span><span></span>
    </div>
    <div class="list" id="list-home"></div>
    <div class="addrow">
      <span></span>
      <input class="cell-inp" id="new-home-order" placeholder="―">
      <input class="cell-inp" id="new-home-num" placeholder="番号">

<div class="mask" id="scan-mask">
  <div class="modal">
    <h3 id="scan-title">読み取り結果</h3>
    <div class="note" id="scan-note">読み取り中…</div>
    <div id="scan-rows"></div>

      <button class="btn btn-save" style="flex:1" onclick="applyScan()">この内容で登録</button>
      <button class="btn" style="flex:1" onclick="closeModal('scan-mask')">キャンセル</button>
    </div>
  </div>
</div>

<div class="mask" id="sub-mask">

    <div style="display:flex;flex-direction:column;gap:12px">
      <div>
        <div class="note" style="margin:0 0 5px">出る選手（現在の打順）</div>
        <select class="cell-sel" id="sub-out" style="text-align:left;padding:10px"></select>
      </div>
      <div>
        <div class="note" style="margin:0 0 5px">入る選手（ベンチ）</div>

      </div>
    </div>
    <div class="modal-acts">
      <button class="btn btn-save" style="flex:1" onclick="applySub()">交代する</button>

<!-- 保存メンバー呼出モーダル -->
<div class="mask" id="load-mask">
  <div class="modal" style="max-width:520px">
    <h3>保存済みチーム</h3>
    <div class="note">呼び出すチームを選んでください。</div>
    <div id="load-list"></div>
    <div class="modal-acts">
      <button class="btn" style="flex:1" onclick="closeModal('load-mask')">閉じる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── データ ────────────────────────────────────────────────────────────────
const rosters = { away:[], home:[] };
const teamNames = { away:'', home:'' };
const POS = [['','―'],['1','P'],['2','C'],['3','1B'],['4','2B'],['5','3B'],
             ['6','SS'],['7','LF'],['8','CF'],['9','RF'],['dh','DH']];

function posLabel(p){
  const map={'1':'P','2':'C','3':'1B','4':'2B','5':'3B','6':'SS','7':'LF','8':'CF','9':'RF','dh':'DH','10':'DH'};
  return map[String(p).toLowerCase()]||String(p||'');
}
function posOptions(sel){
  return POS.map(function(o){
    const s = String(sel||'').toLowerCase()===o[0] ? ' selected' : '';
    return '<option value="'+o[0]+'"'+s+'>'+o[1]+'</option>';
  }).join('');
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(m){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]; }); }

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); },1800);
}

// ── 描画 ──────────────────────────────────────────────────────────────────
function sorted(team){
  const on = rosters[team].filter(function(p){ return p.order; })
    .sort(function(a,b){ return Number(a.order)-Number(b.order); });
  const off = rosters[team].filter(function(p){ return !p.order; });
  return on.concat(off);
}

function render(team){
  const el=document.getElementById('list-'+team);
  const list=sorted(team);
  if(!list.length){
    el.innerHTML='<div style="padding:22px 8px;text-align:center;color:#555;font-size:14px">'
      +'選手が未登録です。下の行から追加するか、写真スキャンを使ってください。</div>';
    return;
  }
  el.innerHTML=list.map(function(p){
    const bench = p.order ? '' : ' bench';
    return '<div class="row'+bench+'" draggable="true" data-id="'+p.id+'" data-team="'+team+'">'
      +'<div class="grip">⠿</div>'
      +'<input class="cell-inp" value="'+esc(p.order)+'" placeholder="―" onchange="edit(\''+team+'\','+p.id+',\'order\',this.value)">'
      +'<input class="cell-inp" value="'+esc(p.num)+'" placeholder="―" onchange="edit(\''+team+'\','+p.id+',\'num\',this.value)">'
      +'<input class="cell-inp name" value="'+esc(p.name)+'" onchange="edit(\''+team+'\','+p.id+',\'name\',this.value)">'
      +'<select class="cell-sel" onchange="edit(\''+team+'\','+p.id+',\'pos\',this.value)">'+posOptions(p.pos)+'</select>'
      +'<div class="row-acts">'
        +'<button class="mini" onclick="toggleBench(\''+team+'\','+p.id+')">'+(p.order?'控え':'出場')+'</button>'
        +'<button class="mini del" onclick="delPlayer(\''+team+'\','+p.id+')">削除</button>'
      +'</div>'
    +'</div>';
  }).join('');
  bindDrag(team);
}

function renderAll(){ render('away'); render('home'); }

// ── 編集 ──────────────────────────────────────────────────────────────────
function edit(team,id,field,val){
  const p=rosters[team].find(function(x){ return x.id===id; });
  if(!p) return;
  p[field]=val.trim();
  if(field==='order') render(team);
  push();
}

function addPlayer(team){
  const o=document.getElementById('new-'+team+'-order').value.trim();
  const n=document.getElementById('new-'+team+'-num').value.trim();
  const nm=document.getElementById('new-'+team+'-name').value.trim();
  const ps=document.getElementById('new-'+team+'-pos').value;
  if(!nm){ toast('選手名を入力してください'); return; }
  rosters[team].push({ id:Date.now()+Math.floor(Math.random()*1000), order:o, num:n, name:nm, pos:ps });
  document.getElementById('new-'+team+'-order').value='';
  document.getElementById('new-'+team+'-num').value='';
  document.getElementById('new-'+team+'-name').value='';
  document.getElementById('new-'+team+'-pos').value='';
  render(team); push();
  document.getElementById('new-'+team+'-name').focus();
}

function delPlayer(team,id){
  const p=rosters[team].find(function(x){ return x.id===id; });
  if(!p) return;
  if(!confirm(p.name+' を削除しますか？')) return;
  rosters[team]=rosters[team].filter(function(x){ return x.id!==id; });
  render(team); push();
}

function toggleBench(team,id){
  const p=rosters[team].find(function(x){ return x.id===id; });
  if(!p) return;
  if(p.order){ p._prevOrder=p.order; p.order=''; }
  else{
    const used=rosters[team].filter(function(x){ return x.order; }).map(function(x){ return Number(x.order); });
    let next=Number(p._prevOrder)||0;
    if(!next||used.indexOf(next)>=0){ next=1; while(used.indexOf(next)>=0) next++; }
    p.order=String(next);
  }
  render(team); push();
}

function renumber(team){
  sorted(team).filter(function(p){ return p.order; })
    .forEach(function(p,i){ p.order=String(i+1); });
  render(team); push();
  toast('打順を振り直しました');
}

function clearTeam(team){
  if(!confirm('このチームの選手をすべて削除しますか？')) return;
  rosters[team]=[]; render(team); push();
}

function onTeamName(team){
  teamNames[team]=document.getElementById('tname-'+team).value;
  push();
}

// ── ドラッグ並べ替え ──────────────────────────────────────────────────────
let dragId=null, dragTeam=null;
function bindDrag(team){
  const rows=document.querySelectorAll('#list-'+team+' .row');
  rows.forEach(function(row){
    row.addEventListener('dragstart',function(e){
      dragId=Number(row.dataset.id); dragTeam=team;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    row.addEventListener('dragend',function(){
      row.classList.remove('dragging');
      rows.forEach(function(r){ r.classList.remove('over'); });
      dragId=null; dragTeam=null;
    });
    row.addEventListener('dragover',function(e){
      if(dragTeam!==team) return;
      e.preventDefault();
      rows.forEach(function(r){ r.classList.remove('over'); });
      row.classList.add('over');
    });
    row.addEventListener('drop',function(e){
      if(dragTeam!==team||dragId==null) return;
      e.preventDefault();
      row.classList.remove('over');
      reorder(team,dragId,Number(row.dataset.id));
    });
  });
}

function reorder(team,fromId,toId){
  if(fromId===toId) return;
  const list=sorted(team);
  const fi=list.findIndex(function(p){ return p.id===fromId; });
  const ti=list.findIndex(function(p){ return p.id===toId; });
  if(fi<0||ti<0) return;
  const moved=list.splice(fi,1)[0];
  list.splice(ti,0,moved);
  // 出場選手のみ 1..n を振り直す
  let n=1;
  list.forEach(function(p){ if(p.order){ p.order=String(n++); } });
  render(team); push();
}

// ── 保存 / 呼出（localStorage） ───────────────────────────────────────────
const LS_KEY='bb_team_rosters';
function readStore(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ return {}; } }
function writeStore(o){ try{ localStorage.setItem(LS_KEY,JSON.stringify(o)); }catch(e){} }

function saveTeam(team){
  const name=(teamNames[team]||'').trim();
  if(!name){ toast('先にチーム名を入力してください'); return; }
  if(!rosters[team].length){ toast('選手が登録されていません'); return; }
  const store=readStore();
  store[name]=JSON.parse(JSON.stringify(rosters[team]));
  writeStore(store);
  toast('「'+name+'」を保存しました');
}

let loadTarget=null;
function loadTeam(team){
  loadTarget=team;
  const store=readStore();
  const keys=Object.keys(store);
  const el=document.getElementById('load-list');
  if(!keys.length){
    el.innerHTML='<div style="padding:18px 0;color:#666;font-size:14px">保存されたチームがありません。</div>';
  }else{
    el.innerHTML=keys.map(function(k){
      return '<div style="display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #262628">'
        +'<span style="flex:1;font-size:15px">'+esc(k)+' <span style="color:#666;font-size:12px">('+store[k].length+'名)</span></span>'
        +'<button class="mini" onclick="applyLoad(\''+encodeURIComponent(k)+'\')">呼び出す</button>'
        +'<button class="mini del" onclick="delSaved(\''+encodeURIComponent(k)+'\')">削除</button>'
      +'</div>';
    }).join('');
  }
  document.getElementById('load-mask').classList.add('open');
}

function applyLoad(enc){
  const key=decodeURIComponent(enc);
  const store=readStore();
  if(!store[key]||!loadTarget) return;
  rosters[loadTarget]=JSON.parse(JSON.stringify(store[key]));
  teamNames[loadTarget]=key;
  document.getElementById('tname-'+loadTarget).value=key;
  render(loadTarget); push();
  closeModal('load-mask');
  toast('「'+key+'」を読み込みました');
}

function delSaved(enc){
  const key=decodeURIComponent(enc);
  if(!confirm('「'+key+'」を削除しますか？')) return;
  const store=readStore(); delete store[key]; writeStore(store);
  loadTeam(loadTarget);
}

function exportJSON(){
  const store=readStore();
  const blob=new Blob([JSON.stringify(store,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const d=new Date();
  const ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  a.href=URL.createObjectURL(blob); a.download='bb_rosters_'+ymd+'.json';
  a.click(); URL.revokeObjectURL(a.href);
}

function importJSON(e){
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  const rd=new FileReader();
  rd.onload=function(){
    try{
      const inc=JSON.parse(rd.result);
      const store=readStore();
      Object.keys(inc).forEach(function(k){ store[k]=inc[k]; });
      writeStore(store);
      toast(Object.keys(inc).length+'チームを取り込みました');
    }catch(err){ toast('読み込みに失敗しました'); }
  };
  rd.readAsText(f);
}

// ── 写真スキャン ──────────────────────────────────────────────────────────
let scanTeam=null, scanPlayers=[];
function onScan(e,team){
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  scanTeam=team; scanPlayers=[];
  document.getElementById('scan-title').textContent=(team==='away'?'先攻':'後攻')+' 読み取り結果';
  document.getElementById('scan-note').textContent='読み取り中… 少々お待ちください';
  document.getElementById('scan-rows').innerHTML='';
  document.getElementById('scan-mask').classList.add('open');

  const rd=new FileReader();
  rd.onload=function(){
    const b64=String(rd.result).split(',')[1];
    fetch('/api/scan-roster',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ imageBase64:b64, mimeType:f.type })
    })
    .then(function(r){ return r.json(); })
    .then(function(data){
      const txt=(data.content&&data.content[0]&&data.content[0].text)||'';
      const clean=txt.replace(/```json|```/g,'').trim();
      const parsed=JSON.parse(clean);
      scanPlayers=parsed.players||[];
      renderScan();
    })
    .catch(function(){
      document.getElementById('scan-note').textContent='読み取りに失敗しました。画像を変えてもう一度お試しください。';
    });
  };
  rd.readAsDataURL(f);
}

function renderScan(){
  document.getElementById('scan-note').textContent=scanPlayers.length+'名を読み取りました。内容を確認・修正してから登録してください。';
  document.getElementById('scan-rows').innerHTML=scanPlayers.map(function(p,i){
    return '<div class="scan-row">'
      +'<input class="cell-inp" value="'+esc(p.order)+'" onchange="scanEdit('+i+',\'order\',this.value)">'
      +'<input class="cell-inp" value="'+esc(p.num)+'" onchange="scanEdit('+i+',\'num\',this.value)">'
      +'<input class="cell-inp name" value="'+esc(p.name)+'" onchange="scanEdit('+i+',\'name\',this.value)">'
      +'<select class="cell-sel" onchange="scanEdit('+i+',\'pos\',this.value)">'+posOptions(p.pos)+'</select>'
      +'<button class="mini del" onclick="scanDel('+i+')">✕</button>'
    +'</div>';
  }).join('');
}
function scanEdit(i,f,v){ scanPlayers[i][f]=v.trim(); }
function scanDel(i){ scanPlayers.splice(i,1); renderScan(); }

function applyScan(){
  if(!scanTeam||!scanPlayers.length){ closeModal('scan-mask'); return; }
  rosters[scanTeam]=scanPlayers.map(function(p,i){
    return { id:Date.now()+i, order:String(p.order||''), num:String(p.num||''),
             name:String(p.name||''), pos:String(p.pos||'') };
  });
  render(scanTeam); push();
  closeModal('scan-mask');
  toast(rosters[scanTeam].length+'名を登録しました');
}

// ── 交代 ──────────────────────────────────────────────────────────────────
let subTeam=null, subKind=null;
function openSub(team,kind){
  subTeam=team; subKind=kind;
  document.getElementById('sub-title').textContent=kind;
  const on=sorted(team).filter(function(p){ return p.order; });
  const off=sorted(team).filter(function(p){ return !p.order; });
  if(!on.length||!off.length){
    toast(!on.length?'出場選手がいません':'ベンチに選手がいません');
    return;
  }
  const fmt=function(p){ return (p.order?p.order+'番 ':'')+(p.num?'#'+p.num+' ':'')+p.name
    +(posLabel(p.pos)?'（'+posLabel(p.pos)+'）':''); };
  document.getElementById('sub-out').innerHTML=on.map(function(p){
    return '<option value="'+p.id+'">'+esc(fmt(p))+'</option>'; }).join('');
  document.getElementById('sub-in').innerHTML=off.map(function(p){
    return '<option value="'+p.id+'">'+esc((p.num?'#'+p.num+' ':'')+p.name)+'</option>'; }).join('');
  document.getElementById('sub-mask').classList.add('open');
}

function applySub(){
  const outId=Number(document.getElementById('sub-out').value);
  const inId=Number(document.getElementById('sub-in').value);
  const po=rosters[subTeam].find(function(p){ return p.id===outId; });
  const pi=rosters[subTeam].find(function(p){ return p.id===inId; });
  if(!po||!pi){ closeModal('sub-mask'); return; }
  pi.order=po.order;
  po._prevOrder=po.order;
  po.order='';
  // 守備交代・代走は守備位置も引き継ぐ（代打は打席のみなので位置は空のまま）
  if(subKind==='守備交代'||subKind==='代走'){ pi.pos=po.pos; }
  po.pos='';
  render(subTeam); push();
  closeModal('sub-mask');
  toast(subKind+'：'+po.name+' → '+pi.name);
}

function closeModal(id){ document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.mask').forEach(function(m){
  m.addEventListener('click',function(e){ if(e.target===m) m.classList.remove('open'); });
});

// ── WebSocket 同期 ────────────────────────────────────────────────────────
let ws=null, wsTimer=null, applyingRemote=false, lastRemote=null;

function setWsUI(ok){
  document.getElementById('ws-dot').className='ws-dot'+(ok?' on':'');
  document.getElementById('ws-label').textContent=ok?'同期中':'切断（再接続待ち）';
}

function connectWS(){
  if(wsTimer){ clearTimeout(wsTimer); wsTimer=null; }
  try{
    ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
    ws.onopen=function(){ setWsUI(true); };
    ws.onclose=function(){ ws=null; setWsUI(false); wsTimer=setTimeout(connectWS,3000); };
    ws.onerror=function(){ try{ ws.close(); }catch(e){} };
    ws.onmessage=function(ev){
      let s=null;
      try{ s=JSON.parse(ev.data); }catch(e){ return; }
      if(!s||s._ctl!==true) return;
      applyRemote(s);
    };
  }catch(e){ wsTimer=setTimeout(connectWS,3000); }
}

function applyRemote(s){
  applyingRemote=true;
  try{
    lastRemote=s;
    if(s.rostersAll){
      if(Array.isArray(s.rostersAll.away)) rosters.away=JSON.parse(JSON.stringify(s.rostersAll.away));
      if(Array.isArray(s.rostersAll.home)) rosters.home=JSON.parse(JSON.stringify(s.rostersAll.home));
    }
    if(s.aab){ teamNames.away=s.aab; document.getElementById('tname-away').value=(s.aab==='先攻'?'':s.aab); }
    if(s.hnm){ teamNames.home=s.hnm; document.getElementById('tname-home').value=(s.hnm==='後攻'?'':s.hnm); }
    renderAll();
    renderGame(s);
  }catch(e){}
  applyingRemote=false;
}

let pushTimer=null;
function push(){
  if(applyingRemote) return;
  if(locked) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer=setTimeout(doPush,80);
}

function doPush(){
  pushTimer=null;
  if(!ws||ws.readyState!==1) return;
  // スコアなど他の状態は最後に受け取った内容を維持したまま、メンバーだけ差し替えて送る
  const base = lastRemote ? JSON.parse(JSON.stringify(lastRemote)) : {};
  base._ctl=true;
  base.rostersAll={ away:rosters.away, home:rosters.home };
  if(teamNames.away) base.aab=teamNames.away;
  if(teamNames.home) base.hnm=teamNames.home;
  base.showScoreOverlay=null;   // 表示コマンドは再送しない
  ws.send(JSON.stringify(base));
}

// ── 場内アナウンス（Azure TTS） ────────────────────────────────────────────
var _annOn=false, _annRate=0.95;
var _ttsReady=false, _ttsVoice='ja-JP-NanamiNeural', _ttsStyle='';
var _ttsCache={}, _audioEl=null;

var POS_YOMI={
  '1':'ピッチャー','2':'キャッチャー','3':'ファースト','4':'セカンド','5':'サード',
  '6':'ショート','7':'レフト','8':'センター','9':'ライト','dh':'指名打者','10':'指名打者',
  'P':'ピッチャー','C':'キャッチャー','1B':'ファースト','2B':'セカンド','3B':'サード',
  'SS':'ショート','LF':'レフト','CF':'センター','RF':'ライト','DH':'指名打者'
};

function _initTTS(){
  fetch('/api/tts/status').then(function(r){ return r.json(); })
    .then(function(d){ _ttsReady=!!d.enabled; _refreshTtsStatus(); })
    .catch(function(){ _ttsReady=false; _refreshTtsStatus(); });
  try{
    _annOn = localStorage.getItem('bb_announce')==='1';
    var r=localStorage.getItem('bb_ann_rate'); if(r!=null) _annRate=Number(r);
    var v=localStorage.getItem('bb_tts_voice'); if(v) _ttsVoice=v;
    var s=localStorage.getItem('bb_tts_style'); if(s!==null) _ttsStyle=s;
  }catch(e){}
  _refreshAnnBtn();
}

function _refreshTtsStatus(){
  var el=document.getElementById('ann-status');
  if(!el) return;
  el.textContent = _ttsReady ? 'Azure音声' : '端末音声';
  el.style.color = _ttsReady ? '#7fd47f' : '#c88';
}

function _refreshAnnBtn(){
  var b=document.getElementById('ann-toggle');
  if(!b) return;
  b.textContent = _annOn ? '🔊 ON' : '🔈 OFF';
  b.className = 'ann-btn' + (_annOn ? ' on' : '');
}

function toggleAnnounce(){
  _annOn=!_annOn;
  try{ localStorage.setItem('bb_announce', _annOn?'1':'0'); }catch(e){}
  _refreshAnnBtn();
  if(_annOn) _speak('アナウンスを開始します');
}

function _ttsKey(t){ return _ttsVoice+'|'+_ttsStyle+'|'+_annRate+'|'+t; }

function _fetchVoice(text){
  var k=_ttsKey(text);
  if(_ttsCache[k]) return Promise.resolve(_ttsCache[k]);
  return fetch('/api/tts',{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ text:text, voice:_ttsVoice, rate:_annRate, style:_ttsStyle })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(!d.audio) throw new Error(d.error||'no audio');
    var url='data:audio/mp3;base64,'+d.audio;
    _ttsCache[k]=url; return url;
  });
}

function _speakLocal(text){
  if(!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ja-JP'; u.rate=_annRate;
    speechSynthesis.speak(u);
  }catch(e){}
}

function _play(url){
  try{
    if(!_audioEl){ _audioEl=new Audio(); _audioEl.preload='auto'; }
    _audioEl.pause(); _audioEl.src=url; _audioEl.currentTime=0;
    var pr=_audioEl.play(); if(pr&&pr.catch) pr.catch(function(){});
  }catch(e){}
}

function _speak(text){
  if(!_annOn||!text) return;
  if(!_ttsReady){ _speakLocal(text); return; }
  var k=_ttsKey(text);
  if(_ttsCache[k]){ _play(_ttsCache[k]); return; }
  _fetchVoice(text).then(_play).catch(function(e){ console.warn('[TTS] Azure失敗 → 端末音声に切替:', e && e.message); _speakLocal(text); });
}

// 「3番、ショート、山田くん」
function _batterPhrase(p){
  if(!p) return '';
  var parts=[];
  if(p.order) parts.push(p.order+'番');
  var pl=POS_YOMI[String(p.pos)]||POS_YOMI[posLabel(p.pos)]||'';
  if(pl) parts.push(pl);
  var nm=String(p.name||'').trim();
  if(!nm) return '';
  parts.push(nm+'くん');
  return parts.join('、');
}

function announceCurrentBatter(){
  if(!_annOn){ toast('先にアナウンスをONにしてください'); return; }
  if(!lastRemote){ toast('コントローラーと未接続です'); return; }
  var s=lastRemote;
  var team = (s.top!==false) ? 'away' : 'home';
  var id = s.selIds ? s.selIds.batter : 0;
  var p = rosters[team].find(function(x){ return x.id===id; });
  if(!p){
    // ID で見つからない場合は表示名から探す
    var nm=(s.batter||'').replace(/^#\d+\s*/,'').trim();
    p = rosters[team].find(function(x){ return x.name && nm.indexOf(x.name)>=0; });
  }
  if(!p){ toast('打者が特定できません'); return; }
  var t=_batterPhrase(p);
  if(t) _speak(t);
}

// 「1回表、綾羽高校の攻撃」
function announceCurrentInning(){
  if(!_annOn){ toast('先にアナウンスをONにしてください'); return; }
  if(!lastRemote){ toast('コントローラーと未接続です'); return; }
  var s=lastRemote;
  var isTop = s.top!==false;
  var team = isTop ? (s.aab||'先攻') : (s.hnm||'後攻');
  _speak((s.inn||1)+'回'+(isTop?'表':'裏')+'、'+team+'の攻撃');
}

// ── 操作ロック ────────────────────────────────────────────────────────────
let locked=false;
function toggleLock(){
  locked=!locked;
  document.body.classList.toggle('locked',locked);
  const b=document.getElementById('btn-lock');
  b.textContent=locked?'🔒 ロック中':'🔓 操作可';
  b.classList.toggle('locked',locked);
  toast(locked?'操作をロックしました':'ロックを解除しました');
}

// ── 試合状況の描画（コントローラーから受信した内容） ──────────────────────
function renderGame(s){
  if(!s) return;
  const inn=s.inn||1, isTop=s.top!==false;
  const n=Math.max(s.maxInn||7, inn);
  const asc=s.asc||[], hsc=s.hsc||[];

  document.getElementById('gb-inn').textContent=inn;
  document.getElementById('gb-tb').textContent=isTop?'▲ 表':'▼ 裏';

  const sum=function(a){ return a.filter(function(v){ return typeof v==='number'; })
    .reduce(function(x,y){ return x+y; },0); };
  const at=sum(asc), ht=sum(hsc);

  let head='<th></th>';
  for(let i=0;i<n;i++) head+='<th>'+(i+1)+'</th>';
  head+='<th class="tot">R</th>';
  document.getElementById('gb-sc-head').innerHTML=head;

  const rowHtml=function(name,sc,tot){
    let h='<td class="tname">'+esc(name)+'</td>';
    for(let i=0;i<n;i++){
      const v=sc[i];
      const disp=(v===null||v===undefined)?'':(v==='x'?'×':String(v));
      h+='<td class="'+((i+1)===inn?'cur':'')+'">'+disp+'</td>';
    }
    return h+'<td class="tot">'+tot+'</td>';
  };
  document.getElementById('gb-sc-away').innerHTML=rowHtml(s.aab||'先攻',asc,at);
  document.getElementById('gb-sc-home').innerHTML=rowHtml(s.hnm||'後攻',hsc,ht);

  const dots=function(id,count,max,cls){
    let h='';
    for(let i=0;i<max;i++) h+='<span class="gb-dot'+(i<count?' '+cls:'')+'"></span>';
    document.getElementById(id).innerHTML=h;
  };
  dots('gb-b',s.b||0,3,'on-b');
  dots('gb-s',s.s||0,2,'on-s');
  dots('gb-o',s.o||0,2,'on-o');

  const r=s.r||{};
  [['gb-b1',1],['gb-b2',2],['gb-b3',3]].forEach(function(pair){
    const el=document.getElementById(pair[0]);
    if(el) el.classList.toggle('on',!!r[pair[1]]);
  });

  // 打者・次打者・次々打者
  const setTxt=function(id,v){ const el=document.getElementById(id); if(el) el.textContent=v||'-'; };
  setTxt('gb-batter',s.batter);
  setTxt('gb-next',s.batterNext);
  setTxt('gb-next2',s.batterNext2);

  // 投手・捕手・守備チーム
  setTxt('gb-pitcher',s.pitcher);
  setTxt('gb-catcher',s.catcher);
  setTxt('gb-defteam',s.defTeam);

  // overlay の表示状態
  const flags=[
    ['打者',    s.showBatter],
    ['打順',    s.showBat],
    ['投捕',    s.showPC],
    ['守備配置', s.showDef],
    ['BSO',    s.showBSO]
  ];
  document.getElementById('gb-flags').innerHTML=flags.map(function(f){
    return '<span class="gb-flag'+(f[1]?' on':'')+'">'+f[0]+'</span>';
  }).join('');
}

// ── 時計 ──────────────────────────────────────────────────────────────────
function tickClock(){
  const d=new Date();
  const p=function(n){ return String(n).padStart(2,'0'); };
  document.getElementById('clock').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}
tickClock();
setInterval(tickClock,1000);

// ── バッテリー表示（Battery Status API：非対応環境では非表示） ─────────────
function initBattery(){
  if(!navigator.getBattery) return;
  navigator.getBattery().then(function(b){
    const wrap=document.getElementById('batt');
    const fill=document.getElementById('batt-fill');
    const txt=document.getElementById('batt-txt');
    wrap.style.display='flex';
    const upd=function(){
      const pct=Math.round(b.level*100);
      fill.style.width=pct+'%';
      fill.className='batt-fill'+(pct<=15?' low':(pct<=40?' mid':''));
      txt.textContent=pct+'%';
      wrap.className='batt'+(b.charging?' charging':'');
    };
    upd();
    b.addEventListener('levelchange',upd);
    b.addEventListener('chargingchange',upd);
  }).catch(function(){});
}
initBattery();

// ── 初期化 ────────────────────────────────────────────────────────────────
['away','home'].forEach(function(t){
  document.getElementById('new-'+t+'-pos').innerHTML=posOptions('');
});
renderAll();
_initTTS();
connectWS();
setWsUI(false);
</script>
